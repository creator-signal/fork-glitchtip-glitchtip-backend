x-environment: &default-environment
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  VALKEY_URL: redis://valkey:6379  # Set to empty string to disable valkey
  SECRET_KEY: change_me
  ENABLE_ORGANIZATION_CREATION: "true"
  ENABLE_TEST_API: "true"
  DEBUG: "true"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
  ENABLE_OBSERVABILITY_API: "true"
  #IS_LOAD_TEST: "true"
  VTASKS_CONCURRENCY: 4
  LOG_LEVEL: INFO
  # Cold storage settings (MinIO for local S3-compatible storage)
  GLITCHTIP_COLD_STORAGE_BUCKET: glitchtip-cold
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_S3_ENDPOINT_URL: http://minio:9000

x-depends_on: &default-depends_on
  - postgres
  - valkey
x-volumes: &default-volumes
  - .:/code
services:
  postgres:
    # Use pg_duckdb image for cold storage features (S3/Parquet archival)
    # Falls back gracefully if standard postgres is used instead
    image: pgduckdb/pgduckdb:18-v1.1.1
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
  valkey:
    image: valkey/valkey:9
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  # Create the bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/glitchtip-cold;
      exit 0;
      "
  web:
    # Uncomment for breakpoint
    #stdin_open: true
    #tty: true
    build: .
    user: root # Allows for usage of ipdb, apt, etc in dev
    command: ./bin/run-all-in-one.sh --reload --reload-ignore-worker-failure
    #command: ./bin/run-granian.sh --reload --reload-ignore-worker-failure --access-log
    #command: python app.py
    #command: ./manage.py runserver 0.0.0.0:8000
    depends_on: *default-depends_on
    volumes: *default-volumes
    ports:
      - "8000:8000"
    environment: *default-environment
volumes:
  minio-data:
